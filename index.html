<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>DNA Cold Storage - Investeerders Demo</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #ffffff; text-align: center; padding: 50px; }
        .card { background: #1e293b; padding: 30px; border-radius: 12px; max-width: 550px; margin: 0 auto; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        input { padding: 12px; width: 80%; border-radius: 6px; border: none; margin-top: 10px; font-size: 18px; text-align: center; }
        .result { margin-top: 25px; font-size: 22px; color: #38bdf8; font-weight: bold; }
        .note { margin-top: 20px; font-size: 13px; color: #94a3b8; font-style: italic; border-top: 1px solid #334155; padding-top: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>DNA Databestand Calculator</h1>
        <p>Bereken hoeveel fysieke massa aan DNA nodig is voor jouw data-opslag.</p>
        
        <label for="gb">Voer aantal Gigabytes (GB) in:</label><br>
        <input type="number" id="gb" value="1000" oninput="bereken()">
        
        <div class="result" id="output">≈ 4,65 microgram DNA</div>
        
        <div class="note">
            “Gebaseerd op een aangetoonde opslagdichtheid van circa 215 PB per gram DNA.”
        </div>
    </div>

    <script>
        function bereken() {
            let gb = parseFloat(document.getElementById('gb').value) || 0;
            
            // Uitgangspunt: 1 GB = 4.65 nanogram
            let totalNg = gb * 4.65;
            let tekst = "";

            if (totalNg < 1000) {
                tekst = "≈ " + totalNg.toFixed(2) + " nanogram (ng) DNA";
            } else if (totalNg < 1000000) {
                let ug = totalNg / 1000;
                tekst = "≈ " + ug.toFixed(2) + " microgram (µg) DNA";
            } else if (totalNg < 1000000000) {
                let mg = totalNg / 1000000;
                tekst = "≈ " + mg.toFixed(2) + " milligram (mg) DNA";
            } else {
                let gram = totalNg / 1000000000;
                tekst = "≈ " + gram.toFixed(2) + " gram (g) DNA";
            }

            document.getElementById('output').innerHTML = tekst;
        }
        
        // Direct even aanroepen bij laden
        bereken();
    </script>
</body>
</html>
